<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groups</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-brand"></a>
    <a href="index.html">Dashboard</a>
    <a href="groups.html" class="active">Groups</a>
    <a href="firmware.html">Firmware</a>
  </nav>

  <div class="page-wrapper">

    <div class="page-header">
      <div>
        <div class="page-title">Device Groups</div>
        <div class="page-subtitle">Manage groups</div>
      </div>
      <button class="btn btn-primary" onclick="showAddForm()">+ Add Group</button>
    </div>

    <div id="alert-container"></div>

    <div id="form-section" class="form-section" style="display:none;">
      <div class="form-section-title" id="form-title">Add New Group</div>
      <input type="hidden" id="edit-id" />
      <div class="form-row">
        <div class="form-group">
          <label for="group-name">Group Name *</label>
          <input type="text" id="group-name"/>
        </div>
        <div class="form-group">
          <label for="parent-group">Parent Group</label>
          <select id="parent-group">
            <option value="">— None (Root Group) —</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveGroup()">
          <span id="save-btn-text">Save Group</span>
        </button>
        <button class="btn btn-secondary" onclick="hideForm()">Cancel</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">All Groups</div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Parent Group</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="groups-tbody">
            <tr><td colspan="5" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="js/groups.js"></script>
</body>
</html>
